[package]
name = "pet-webcam"
version = "0.1.0"
edition = "2024"

[features]
default = []
ep-acl = ["ort/acl"]
ep-coreml = ["ort/coreml"]
ep-cuda = ["ort/cuda"]
ep-directml = ["ort/directml"]
ep-tensorrt = ["ort/tensorrt"]
ep-xnnpack = ["ort/xnnpack"]

[dependencies]
anyhow = "1.0"
argh = "0.1"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["rayon"]}
ndarray = { version = "0.17", default-features = false}
nokhwa = { version = "0.10", features = ["input-native"] }
num-derive = "0.4"
num-traits = "0.2"
ort = { version = "=2.0.0-rc.13", features = ["default"] }
strum = { version = "0", features = ["derive"] }
strum_macros = "0"
tracing = "0.1"
tracing-subscriber = "0.3"
webp = "0.3"
